name: Apply reviewed integrity fixes

on:
  push:
    branches: ['fix/research-evidence-retrieval-20260915']
    paths:
      - '.github/workflows/apply-review.yml'
      - '.maintenance/review-patch.part1'
      - '.maintenance/review-patch.part2'

permissions:
  contents: read

jobs:
  apply:
    if: github.event_name == 'push' && github.ref == 'refs/heads/fix/research-evidence-retrieval-20260915'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      commit: ${{ steps.commit.outputs.commit }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/research-evidence-retrieval-20260915
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Verify and apply exact locally tested patch
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python - <<'PY'
          import hashlib, lzma, os
          from pathlib import Path
          compressed = b''.join(Path(f'.maintenance/review-patch.part{i}').read_bytes() for i in (1, 2))
          patch = lzma.decompress(compressed)
          expected = '8023af8ae7d28121a0f16967c8fc9c25f1acaa84955de7b54515a9edd073cfce'
          if hashlib.sha256(patch).hexdigest() != expected:
              raise SystemExit('Patch checksum mismatch')
          Path(os.environ['RUNNER_TEMP'], 'review.patch').write_bytes(patch)
          PY
          git apply --check --unidiff-zero "$RUNNER_TEMP/review.patch"
          git apply --unidiff-zero "$RUNNER_TEMP/review.patch"
          git diff --check
      - name: Verify offline regressions
        run: |
          set -o pipefail
          python -B -m unittest discover -s evals -p 'test_*.py' -v 2>&1 | tee "$RUNNER_TEMP/review-unit.txt"
      - name: Commit tested code to the review branch only
        id: commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md SKILL.md scripts evals references
          git commit -m 'fix: preserve token-window and evidence retrieval integrity'
          git push origin HEAD:fix/research-evidence-retrieval-20260915
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          git rev-parse HEAD > "$RUNNER_TEMP/tested-commit.txt"
          git archive --format=zip -o "$RUNNER_TEMP/review-source.zip" HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: review-unit-verification
          path: |
            ${{ runner.temp }}/review-unit.txt
            ${{ runner.temp }}/tested-commit.txt
            ${{ runner.temp }}/review-source.zip
          retention-days: 7
  real-model:
    needs: apply
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.apply.outputs.commit }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install CPU-only local model runtime
        run: |
          echo "HF_HOME=$RUNNER_TEMP/hf-review" >> "$GITHUB_ENV"
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'sentence-transformers==5.7.0'
      - name: Execute frozen multilingual retrieval cases
        run: |
          python -B evals/real_model_smoke.py --allow-download --output "$RUNNER_TEMP/semantic-smoke.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: review-real-model-verification
          path: ${{ runner.temp }}/semantic-smoke.json
          retention-days: 7
