name: Apply reviewed retrieval fix
on:
  push:
    branches: [fix/retrieval-evidence-integrity]
    paths: ['.review-fix.py', '.github/workflows/apply-reviewed-fix.yml']
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'LWH-9393/my-dear-research-center' && github.ref == 'refs/heads/fix/retrieval-evidence-integrity'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply exact reviewed bytes and test before committing
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = 'fix/retrieval-evidence-integrity'
          python -B .review-fix.py
          python -B -m unittest discover -s evals -p 'test_*.py' -v
          git diff --check
          git rm .review-fix.py
          git add README.md SKILL.md evals references scripts
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: preserve full semantic evidence and require grounded record states'
          git push origin "HEAD:$GITHUB_REF_NAME"
